name: Deploy Nuxt Application

on:
  push:
    branches:
      - main

jobs:
  create-deployment-artifacts:
    name: Create deployment artifacts
    runs-on: self-hosted
    outputs:
      DEPLOYMENT_MATRIX: ${{ steps.export-deployment-matrix.outputs.DEPLOYMENT_MATRIX }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js and npm
        uses: actions/setup-node@v3
        with:
          node-version: 16

      - name: Retrieve deployment-config.json from Secrets
        run: |
          echo '${{ secrets.DEPLOYMENT_CONFIG }}' | jq '.' > deployment-config.json

      - name: Install npm dependencies
        run: |
          apiPath=$(jq -r '.[0].apiPath' deployment-config.json)
          mediaPath=$(jq -r '.[0].mediaPath' deployment-config.json)
          echo $apiPath
          echo $mediaPath

          touch nuxt.config.js
          echo "
            const pkg = require('./package')

            module.exports = {
              target: 'static',

              /*
              ** Headers of the page
              */
              head: {
                title: pkg.name,
                meta: [
                  { charset: 'utf-8' },
                  { name: 'viewport', content: 'width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0' },
                  { hid: 'description', name: 'description', content: pkg.description }
                ],
                link: [
                  { rel: 'stylesheet', href: '/plugins/fontawesome-free/css/all.min.css' },
                  { rel: 'stylesheet', href: 'https://code.ionicframework.com/ionicons/2.0.1/css/ionicons.min.css' },
                  { rel: 'stylesheet', href: '/plugins/overlayScrollbars/css/OverlayScrollbars.min.css' },
                  { rel: 'stylesheet', href: '/dist/css/adminlte.min.css' },
                  { rel: 'stylesheet', href: 'https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700' },
                ],
                script: [
                  { src: '/plugins/jquery/jquery.min.js' },
                  { src: '/plugins/bootstrap/js/bootstrap.bundle.min.js' },
                  { src: '/plugins/overlayScrollbars/js/jquery.overlayScrollbars.min.js' },
                  { src: '/plugins/inputmask/min/jquery.inputmask.bundle.min.js' },
                  { src: '/plugins/jquery-mousewheel/jquery.mousewheel.js' },
                  { src: '/plugins/raphael/raphael.min.js' },
                  { src: '/plugins/jquery-mapael/jquery.mapael.min.js' },
                  { src: '/plugins/jquery-mapael/maps/usa_states.min.js' },
                  { src: '/plugins/chart.js/Chart.min.js' },
                  { src: '/dist/js/pages/dashboard2.js' },
                  { src: '/dist/js/demo.js' },
                ]
              },

              /*
              ** Customize the progress-bar color
              */
              loading: { 
                continuous: 'true',
                color: 'red',
                height: '4px'
              },

              /*
              ** Global CSS
              */
              css: [
              ],

              router: {
                middleware: [
                  'clearValidationErrors',
                  'auth',
                  'organization'
                ]
              },

              /*
              ** Plugins to load before mounting the App
              */
              plugins: [
                '@/plugins/mixins/validation',
                '@/plugins/mixins/auth',
                '@/plugins/mixins/settings',
                '@/plugins/axios',
                '@/plugins/charts',
                '@/plugins/asyncComputed',
                '@/plugins/vue-select',
                '@/plugins/mask',
                { src: '@/plugins/carousel3d', ssr: false },
                { src: '@/plugins/vue-json-excel', ssr: false },
                { src: '@/plugins/vue2-google-maps.js', ssr: false},
                { src: '@/plugins/datepicker', ssr: false }
              ],

              auth: {
                strategies: {
                  local: {
                    endpoints: {
                      login: {url: '/login', method: 'post', propertyName: 'token'},
                      logout: {url: '/logout', method: 'get'},
                      user: {url: '/me', method: 'get', propertyName: 'data'},
                    }
                  }
                },
                redirect: {
                  login: '/auth/login',
                  logout: '/auth/login',
                  home: '/'
                }
              },

              /*
              ** Nuxt.js modules
              */
              modules: [
                // Doc: https://github.com/nuxt-community/axios-module#usage
                '@nuxtjs/axios',
                '@nuxtjs/auth'
              ],

              axios: {
                baseURL: $apiPath,
              },
              
              build: {
                /*
                ** You can extend webpack config here    qqqq
                */
                extend(config, ctx) {
                  transpile: [/^vue2-google-maps($|\/)/]
                },
              },
            }
            " > nuxt.config.js

          cd store
          touch settings.js
          echo "
            export const state = () => ({
              baseColor: 'blue',
              baseHeight: '50px',
              darkStatus: true,
              organization: {
                value: '',
                text: '',
                time_zone: '',
                logo_path: '',
              },
              city: {
                id: '',
                name: '',
              },
              mediaUrl: $mediaPath,
              baseUrl: $apiPath,
            })
            
            export const getters = {
              baseColor(state) {
                return state.baseColor;
              },
              baseHeight(state) {
                return state.baseHeight;
              },
              darkStatus(state) {
                return state.darkStatus;
              },
              city(state) {
                return state.city;
              },
              organization(state) {
                return state.organization;
              },
              mediaUrl(state) {
                return state.mediaUrl;
              },
              baseUrl(state) {
                return state.baseUrl;
              },
            }
            
            export const mutations = {
              SET_ORGANIZATION(state, organization) {
                state.organization = organization
              },
              SET_CITY(state, city) {
                state.city = city;
              }
            }
            
            export const actions = {
              setOrganization({commit}, organization) {
                commit('SET_ORGANIZATION', organization);
              },
              setCity({commit}, city) {
                commit('SET_CITY', city);
              }
            }
          " > settings.js
          cd ..
          npm install
          npm run generate

      - name: Create deployment artifacts
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: tar -czf "${GITHUB_SHA}".tar.gz dist static

      - name: Store artifacts for distribution
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: ${{ github.sha }}.tar.gz

      - name: Export deployment artifacts
        id: export-deployment-matrix
        run: |
          delimiter="$(openssl rand -hex 8)"
          JSON="$(cat ./deployment-config.json)"
          echo "DEPLOYMENT_MATRIX<<${delimiter}" >> "${GITHUB_OUTPUT}"
          echo "$JSON" >> "${GITHUB_OUTPUT}"
          echo "${delimiter}" >> "${GITHUB_OUTPUT}"

  prepare-release-on-server:
    runs-on: self-hosted
    needs: create-deployment-artifacts
    strategy:
      matrix:
        server: ${{ fromJson(needs.create-deployment-artifacts.outputs.DEPLOYMENT_MATRIX) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-build

      - name: Upload
        uses: appleboy/scp-action@master
        with:
          host: ${{ matrix.server.ip }}
          username: ${{ matrix.server.username }}
          password: ${{ matrix.server.password }}
          port: ${{ matrix.server.port }}
          source: ${{ github.sha }}.tar.gz
          target: ${{ matrix.server.path }}/artifacts

      - name: Extract archive and create directories
        uses: appleboy/ssh-action@master
        env:
          GITHUB_SHA: ${{ github.sha }}
        with:
          host: ${{ matrix.server.ip }}
          username: ${{ matrix.server.username }}
          password: ${{ matrix.server.password }}
          port: ${{ matrix.server.port }}
          envs: GITHUB_SHA
          script: |
            # Create a new directory with the commit hash as the directory name
            mkdir -p "${{ matrix.server.path }}/releases/${GITHUB_SHA}"

            # Extract the tar file into our release directory
            tar xzf ${{ matrix.server.path }}/artifacts/${GITHUB_SHA}.tar.gz -C "${{ matrix.server.path }}/releases/${GITHUB_SHA}"

  run-before-hooks:
    name: "${{ matrix.server.name }}: Before hook"
    runs-on: self-hosted
    needs: [create-deployment-artifacts, prepare-release-on-server]
    strategy:
      matrix:
        server: ${{ fromJson(needs.create-deployment-artifacts.outputs.DEPLOYMENT_MATRIX) }}
    steps:
      - name: Runs before hooks
        uses: appleboy/ssh-action@master
        env:
          GITHUB_SHA: ${{ github.sha }}
          RELEASE_PATH: ${{ matrix.server.path }}/releases/${{ github.sha }}
          ACTIVE_PATH: ${{ matrix.server.path }}/current
          STORAGE_PATH: ${{ matrix.server.path }}/storage
          BASE_PATH: ${{ matrix.server.path }}
        with:
          host: ${{ matrix.server.ip }}
          username: ${{ matrix.server.username }}
          password: ${{ matrix.server.password }}
          port: ${{ matrix.server.port }}
          envs: GITHUB_SHA, RELEASE_PATH, ACTIVE_PATH, STORAGE_PATH, BASE_PATH
          script: |
            ${{ matrix.server.beforeHooks }}

  activate-release:
    name: "${{ matrix.server.name }}: Activate release"
    runs-on: self-hosted
    needs:
      [create-deployment-artifacts, prepare-release-on-server, run-before-hooks]
    strategy:
      matrix:
        server: ${{ fromJson(needs.create-deployment-artifacts.outputs.DEPLOYMENT_MATRIX) }}
    steps:
      - name: Activate release
        uses: appleboy/ssh-action@master
        env:
          GITHUB_SHA: ${{ github.sha }}
          RELEASE_PATH: ${{ matrix.server.path }}/releases/${{ github.sha }}
          ACTIVE_RELEASE_PATH: ${{ matrix.server.path }}/current
          BASE_PATH: ${{ matrix.server.path }}
          VIRTUAL_HOST_FILE_PATH: ${{ matrix.server.virtualHostFilePath }}
          VIRTUAL_HOST_FILE: ${{ matrix.server.virtualHostFile }}
          SERVER_NAME: ${{ matrix.server.serverName }}
          SERVER_ALIAS: ${{ matrix.server.serverAlias }}
          SERVER_ADMIN: ${{ matrix.server.serverAdmin }}
          REFRESH_VIRTUAL_HOST: ${{ matrix.server.refreshVirtualHost }}
        with:
          host: ${{ matrix.server.ip }}
          username: ${{ matrix.server.username }}
          password: ${{ matrix.server.password }}
          port: ${{ matrix.server.port }}
          envs: GITHUB_SHA, RELEASE_PATH, ACTIVE_RELEASE_PATH, BASE_PATH, VIRTUAL_HOST_FILE_PATH, SERVER_NAME, SERVER_ALIAS, SERVER_ADMIN, REFRESH_VIRTUAL_HOST, VIRTUAL_HOST_FILE
          script: |
            # To link the release path as the active release path
            ln -s -n -f $RELEASE_PATH $ACTIVE_RELEASE_PATH

            # To add .htaccess
            cd $ACTIVE_RELEASE_PATH
            touch .htaccess
            echo "
              <ifModule mod_rewrite.c>
                  RewriteEngine On
                RewriteBase /
                RewriteRule ^index\.html$ - [L]
                RewriteCond %{REQUEST_FILENAME} !-f
                RewriteCond %{REQUEST_FILENAME} !-d
                RewriteRule . /index.html [L]
              </ifModule>
            " > .htaccess

            # This code is to generate the virtual host if it is not there
            if [ ! -e $VIRTUAL_HOST_FILE_PATH/$VIRTUAL_HOST_FILE ] || [ $REFRESH_VIRTUAL_HOST = true ]; then
                echo "
                <VirtualHost *:80>
                    ServerAdmin $SERVER_ADMIN
                    ServerName $SERVER_NAME
                    ServerAlias $SERVER_ALIAS
                    DocumentRoot $ACTIVE_RELEASE_PATH/dist/
                    <Directory  $ACTIVE_RELEASE_PATH/>
                        AllowOverride All
                    </Directory>

                    ErrorLog ${APACHE_LOG_DIR}/error.log
                    CustomLog ${APACHE_LOG_DIR}/access.log combined
                </VirtualHost>" > $VIRTUAL_HOST_FILE_PATH/$VIRTUAL_HOST_FILE

                sudo a2ensite $VIRTUAL_HOST_FILE
                systemctl reload apache2
            fi

  run-after-hooks:
    name: "${{ matrix.server.name }}: After hook"
    runs-on: self-hosted
    needs:
      [create-deployment-artifacts, prepare-release-on-server, activate-release]
    strategy:
      matrix:
        server: ${{ fromJson(needs.create-deployment-artifacts.outputs.DEPLOYMENT_MATRIX) }}
    steps:
      - name: Runs after hooks
        uses: appleboy/ssh-action@master
        env:
          GITHUB_SHA: ${{ github.sha }}
          RELEASE_PATH: ${{ matrix.server.path }}/releases/${{ github.sha }}
          ACTIVE_PATH: ${{ matrix.server.path }}/current
          BASE_PATH: ${{ matrix.server.path }}
        with:
          host: ${{ matrix.server.ip }}
          username: ${{ matrix.server.username }}
          password: ${{ matrix.server.password }}
          port: ${{ matrix.server.port }}
          envs: GITHUB_SHA, RELEASE_PATH, ACTIVE_PATH, BASE_PATH
          script: |
            ${{ matrix.server.afterHooks }}

  clean-up:
    name: "${{ matrix.server.name }}: Clean up"
    runs-on: self-hosted
    needs:
      [
        create-deployment-artifacts,
        prepare-release-on-server,
        activate-release,
        run-after-hooks,
      ]
    strategy:
      matrix:
        server: ${{ fromJson(needs.create-deployment-artifacts.outputs.DEPLOYMENT_MATRIX) }}
    steps:
      - name: Runs clean up
        uses: appleboy/ssh-action@master
        env:
          ARTIFACTS_PATH: ${{ matrix.server.path }}/artifacts
          RELEASE_PATH: ${{ matrix.server.path }}/releases
        with:
          host: ${{ matrix.server.ip }}
          username: ${{ matrix.server.username }}
          password: ${{ matrix.server.password }}
          port: ${{ matrix.server.port }}
          envs: RELEASE_PATH, ARTIFACTS_PATH
          script: |
            cd $RELEASE_PATH && ls -t -1 | tail -n +2 | xargs rm -rf
            cd $ARTIFACTS_PATH && ls -t -1 | tail -n +2 | xargs rm -rf
